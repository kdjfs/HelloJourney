spring:
  profiles:
    active: @spring.profiles.active@

server:
  port: 8000

app:
  name: HelloAgents智能旅行助手
  version: 2.0.0

  tencent-maps:
    key: "DCxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  google-maps:
    api-key: ""
    proxy: ""

  xhs:
    cookie: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  llm:
    active-provider: deepseek
    timeout: 60
    providers:
      deepseek:
        name: DeepSeek
        api-key: "xxxxxxxxxxxxxxxxxxx46c9"
        base-url: https://api.deepseek.com/v1
        model: deepseek-chat
      glm:
        name: GLM (智谱)
        api-key: ""
        base-url: https://open.bigmodel.cn/api/paas/v4
        model: glm-4
      minimax:
        name: MiniMax
        api-key: ""
        base-url: https://api.minimax.chat/v1
        model: MiniMax-Text-01
      doubao:
        name: 豆包 (字节跳动)
        api-key: ""
        base-url: https://ark.cn-beijing.volces.com/api/v3
        model: doubao-pro-4k
      openai:
        name: GPT (OpenAI)
        api-key: ""
        base-url: https://api.openai.com/v1
        model: gpt-4
      grok:
        name: Grok (xAI)
        api-key: ""
        base-url: https://api.x.ai/v1
        model: grok-2
      kimi:
        name: Kimi (Moonshot)
        api-key: ""
        base-url: https://api.moonshot.cn/v1
        model: moonshot-v1-8k
      dashscope:
        name: 阿里百炼
        api-key: ""
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        model: qwen-turbo
      siliconflow:
        name: 硅基流动
        api-key: ""
        base-url: https://api.siliconflow.cn/v1
        model: Qwen/Qwen2.5-7B-Instruct
