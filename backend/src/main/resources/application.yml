spring:
  profiles:
    active: @spring.profiles.active@

server:
  port: ${PORT:8000}

app:
  name: HelloAgents智能旅行助手
  version: 2.0.0

  amap-maps:
    key: ${AMAP_API_KEY:}
    base-url: ${AMAP_API_BASE_URL:https://restapi.amap.com}

  tencent-maps:
    key: ${TENCENT_MAPS_KEY:}

  google-maps:
    api-key: ${GOOGLE_MAPS_API_KEY:}
    proxy: ${GOOGLE_MAPS_PROXY:}

  xhs:
    cookie: ${XHS_COOKIE:}
    xs: ${XHS_XS:}
    xs-common: ${XHS_XS_COMMON:}
    xt: ${XHS_XT:}

  settings:
    allow-secret-updates: ${SETTINGS_ALLOW_SECRET_UPDATES:false}
    admin-token: ${SETTINGS_ADMIN_TOKEN:}

  tasks:
    execution-timeout-seconds: ${TRIP_TASK_TIMEOUT:300}
    data-dir: ${TRIP_TASK_DATA_DIR:data/trip_tasks}

  agent:
    max-iterations: ${AGENT_MAX_ITERATIONS:8}
    tool-timeout-seconds: ${AGENT_TOOL_TIMEOUT_SECONDS:15}
    tool-max-retries: ${AGENT_TOOL_MAX_RETRIES:1}
    max-tool-result-chars: ${AGENT_MAX_TOOL_RESULT_CHARS:20000}
    structured-repair-attempts: ${AGENT_STRUCTURED_REPAIR_ATTEMPTS:2}

  llm:
    active-provider: ${LLM_ACTIVE_PROVIDER:deepseek}
    timeout: ${LLM_TIMEOUT:120}
    max-retries: ${LLM_MAX_RETRIES:2}
    retry-base-delay-ms: ${LLM_RETRY_BASE_DELAY_MS:250}
    providers:
      deepseek:
        name: DeepSeek
        api-key: ${LLM_DEEPSEEK_API_KEY:}
        base-url: ${LLM_DEEPSEEK_BASE_URL:https://api.deepseek.com}
        model: ${LLM_DEEPSEEK_MODEL:deepseek-v4-pro}
      glm:
        name: GLM (智谱)
        api-key: ${LLM_GLM_API_KEY:}
        base-url: ${LLM_GLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
        model: ${LLM_GLM_MODEL:glm-4}
      minimax:
        name: MiniMax
        api-key: ${LLM_MINIMAX_API_KEY:}
        base-url: ${LLM_MINIMAX_BASE_URL:https://api.minimax.chat/v1}
        model: ${LLM_MINIMAX_MODEL:MiniMax-Text-01}
      doubao:
        name: 豆包 (字节跳动)
        api-key: ${LLM_DOUBAO_API_KEY:}
        base-url: ${LLM_DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
        model: ${LLM_DOUBAO_MODEL:doubao-pro-4k}
      openai:
        name: GPT (OpenAI)
        api-key: ${LLM_OPENAI_API_KEY:}
        base-url: ${LLM_OPENAI_BASE_URL:https://api.openai.com/v1}
        model: ${LLM_OPENAI_MODEL:gpt-4}
      grok:
        name: Grok (xAI)
        api-key: ${LLM_GROK_API_KEY:}
        base-url: ${LLM_GROK_BASE_URL:https://api.x.ai/v1}
        model: ${LLM_GROK_MODEL:grok-2}
      kimi:
        name: Kimi (Moonshot)
        api-key: ${LLM_KIMI_API_KEY:}
        base-url: ${LLM_KIMI_BASE_URL:https://api.moonshot.cn/v1}
        model: ${LLM_KIMI_MODEL:moonshot-v1-8k}
      dashscope:
        name: 阿里百炼
        api-key: ${LLM_DASHSCOPE_API_KEY:}
        base-url: ${LLM_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        model: ${LLM_DASHSCOPE_MODEL:qwen-turbo}
      siliconflow:
        name: 硅基流动
        api-key: ${LLM_SILICONFLOW_API_KEY:}
        base-url: ${LLM_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
        model: ${LLM_SILICONFLOW_MODEL:Qwen/Qwen2.5-7B-Instruct}
