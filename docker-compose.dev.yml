services:
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LLM_ACTIVE_PROVIDER: ${LLM_ACTIVE_PROVIDER:-deepseek}
      LLM_DEEPSEEK_API_KEY: ${LLM_DEEPSEEK_API_KEY:-}
      LLM_DEEPSEEK_BASE_URL: ${LLM_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LLM_DEEPSEEK_MODEL: ${LLM_DEEPSEEK_MODEL:-deepseek-v4-pro}
      LLM_SILICONFLOW_API_KEY: ${LLM_SILICONFLOW_API_KEY:-}
      TENCENT_MAPS_KEY: ${TENCENT_MAPS_KEY:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SETTINGS_ALLOW_SECRET_UPDATES: "false"
      TRIP_TASK_DATA_DIR: /app/data/trip_tasks
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: ""
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped
