server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # AMap JSAPI 2.0 needs a wider policy than a plain same-origin app:
    #   connect-src / img-src / font-src: the SDK fetches its custom style, vector
    #     tiles, glyph and sdf textures, and route data from the *.amap.com and
    #     *.autonavi.com families (webapi, vdata, mvt, custyle, glyph*, sdf*,
    #     wprd*.is.autonavi.com). Allowing only webapi/restapi renders no basemap.
    #   worker-src blob:: the renderer builds its Web Worker from a blob: URL.
    #   'wasm-unsafe-eval' + 'unsafe-eval': the SDK registers its rendering modules
    #     by evaluating code and compiles a WebAssembly geometry module. Without
    #     'unsafe-eval' the basemap silently never draws: the markers, logo and
    #     copyright still render while the canvas stays black, because module
    #     resolution fails with "AMap.Module.WebGLRender is not a constructor"
    #     (verified in the browser console). 'wasm-unsafe-eval' alone is not enough.
    # The Google basemap (opt-in, see frontend/src/components/TripMap/googleRenderer.ts)
    # needs its own hosts on top of that:
    #   script-src: maps.googleapis.com serves the loader, maps.gstatic.com the
    #     versioned SDK chunk it pulls in. Both are external, so the inline-script
    #     ban below stays intact.
    #   connect-src: directions, place details, and vector tiles are XHR/fetch.
    #   font-src: Google's map labels use fonts.gstatic.com.
    #   img-src already covers it through the `https:` scheme source; raster tiles
    #     and marker sprites come from the same googleapis/gstatic hosts.
    # Inline scripts stay forbidden on purpose: the AMap security code is published
    # from the app bundle (src/utils/env.ts) instead of an inline <script>, which
    # this policy would silently block and leave the map blank.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://*.amap.com https://maps.googleapis.com https://maps.gstatic.com 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self' ws: wss: blob: https://*.amap.com https://*.autonavi.com https://maps.googleapis.com https://maps.gstatic.com; font-src 'self' data: https://*.amap.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/trip/ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 360s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
