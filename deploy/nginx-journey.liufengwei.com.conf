# ============================================================================
# journey.liufengwei.com —— 宿主机 nginx 反向代理到 Docker Compose（127.0.0.1:8080）
#
# 放置：
#   sudo cp deploy/nginx-journey.liufengwei.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/nginx-journey.liufengwei.com.conf \
#              /etc/nginx/sites-enabled/journey.liufengwei.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS 证书（先把 DNS A 记录指向服务器 IP）：
#   sudo certbot --nginx -d journey.liufengwei.com
# 证书签好后再把下面的 ssl 路径对上（certbot 一般会自动改好）。
#
# 注意：生成一份行程需要 3~6 分钟，所有超时必须 ≥ 620s，
# 否则用户会看到 nginx 的 504，而后端其实还在算。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name journey.liufengwei.com;

    # certbot 的 http-01 校验走 80 端口，这一步不要拦
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name journey.liufengwei.com;

    ssl_certificate     /etc/letsencrypt/live/journey.liufengwei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/journey.liufengwei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 4m;

    # 任务进度用 WebSocket 推送（容器内 nginx 再转一层，这里也要放行 Upgrade）
    location /api/trip/ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 行程生成是长请求，别让网关先超时
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        # 大图/长图导出不要攒在网关里
        proxy_buffering off;
    }
}
