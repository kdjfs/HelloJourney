# ============================================================================
# liufengwei.com 站点配置（2026-11-25 恢复）
#   443 liufengwei.com : 个人主页（/var/www/youxi）+ HelloJourney 子路径 + /api 反代
#   443 blog.liufengwei.com : 个人博客（/var/www/blog）
#   80  : 跳转 https，保留 ACME 校验
#   8080 : 默认站（历史遗留，直接托管 /var/www/youxi）
# ============================================================================

server {
    listen 8080;
    server_name _;
    root /var/www/youxi;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 80;
    listen [::]:80;
    server_name liufengwei.com www.liufengwei.com blog.liufengwei.com;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name liufengwei.com;

    ssl_certificate     /etc/letsencrypt/live/liufengwei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liufengwei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/youxi;
    index index.html;
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- HelloJourney（智途星旅）子路径 ----
    location /hellojourney/ {
        try_files $uri $uri/ /hellojourney/index.html;
    }

    location /api/trip/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 生成一份行程 3~6 分钟，别让网关先超时
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        proxy_buffering off;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name blog.liufengwei.com;

    ssl_certificate     /etc/letsencrypt/live/liufengwei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liufengwei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/blog;
    index index.html;
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|webp|avif|ico|mp3|mp4|wasm)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:xml|json)$ {
        expires 1h;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Astro 预渲染页面：优先精确文件，其次目录 index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.liufengwei.com;

    ssl_certificate     /etc/letsencrypt/live/liufengwei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liufengwei.com/privkey.pem;

    return 301 https://liufengwei.com$request_uri;
}
