# ============================================================================
# 方案 B（不用 Docker）：宿主机 nginx 直接托管前端 + 反代 systemd 里的 jar
#
# 目录约定：
#   /var/www/journey/            ← frontend/dist 的内容
#   /opt/hellojourney/app.jar    ← 后端 jar
#   /etc/hellojourney/env        ← 环境变量（权限 600，属主 www-data）
#   systemd: hellojourney-backend.service 监听 127.0.0.1:8000
#
# 放置：
#   sudo cp deploy/nginx-journey-static.liufengwei.com.conf /etc/nginx/sites-available/
#   sudo ln -s ... /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name journey.liufengwei.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name journey.liufengwei.com;

    ssl_certificate     /etc/letsencrypt/live/journey.liufengwei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/journey.liufengwei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/journey;
    index index.html;
    client_max_body_size 4m;

    # 安全头：直接照搬 frontend/nginx.conf 的那套即可（这里给一份精简版）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 地图需要 amap/autonavi + google 的域名，详见 frontend/nginx.conf 里的长注释；
    # 用容器方案时这条由容器内 nginx 负责，这里不重复设置以免互相覆盖。
    # add_header Content-Security-Policy "..." always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/trip/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 生成一份行程 3~6 分钟
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
        proxy_buffering off;
    }

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
